# Netlify Image CDN: product photos are resized and converted to AVIF/WebP
# at the edge (see components/ProductImage.tsx). It only fetches hosts listed
# here, mirroring the /api/img allowlist: Shopify's CDN, WordPress's image CDN,
# and each vendor's own domain from VENDORS in lib/data.ts.
#
# A vendor missing from this list is not broken, only slower: the Image CDN
# refuses it and ProductImage falls straight back to /api/img. Add a new
# vendor's domain here when it goes live.
[images]
remote_images = [
  "https://([a-z0-9-]+\\.)*cdn\\.shopify\\.com/.*",
  "https://([a-z0-9-]+\\.)*cdn\\.shopifycdn\\.com/.*",
  "https://([a-z0-9-]+\\.)*wp\\.com/.*",
